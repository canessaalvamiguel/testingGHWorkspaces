<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Personas</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container { max-width: 900px; margin: 0 auto; }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: #0f172a;
    }

    /* Card */
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    /* Form */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .75rem;
    }

    @media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }

    .field { display: flex; flex-direction: column; gap: .3rem; }
    .field label { font-size: .8rem; font-weight: 600; color: #64748b; }

    input {
      padding: .55rem .75rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: .95rem;
      transition: border-color .15s;
      outline: none;
    }
    input:focus { border-color: #6366f1; }
    input.error { border-color: #ef4444; }

    .field-error { font-size: .75rem; color: #ef4444; display: none; }
    .field-error.visible { display: block; }

    .form-actions { margin-top: 1rem; display: flex; gap: .5rem; }

    /* Buttons */
    .btn {
      padding: .55rem 1.1rem;
      border: none;
      border-radius: 8px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .btn-primary  { background: #6366f1; color: #fff; }
    .btn-primary:hover:not(:disabled)  { background: #4f46e5; }
    .btn-secondary { background: #e2e8f0; color: #475569; }
    .btn-secondary:hover:not(:disabled) { background: #cbd5e1; }
    .btn-danger   { background: #ef4444; color: #fff; }
    .btn-danger:hover:not(:disabled)   { background: #dc2626; }
    .btn-edit     { background: #f59e0b; color: #fff; padding: .35rem .75rem; font-size: .8rem; }
    .btn-edit:hover:not(:disabled)     { background: #d97706; }
    .btn-del      { background: #ef4444; color: #fff; padding: .35rem .75rem; font-size: .8rem; }
    .btn-del:hover:not(:disabled)      { background: #dc2626; }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      padding: .7rem 1.2rem;
      border-radius: 10px;
      font-size: .9rem;
      font-weight: 500;
      color: #fff;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .25s, transform .25s;
      pointer-events: none;
      z-index: 999;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.success { background: #22c55e; }
    #toast.error   { background: #ef4444; }

    /* Table */
    .table-wrap { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    thead tr { background: #f8fafc; }
    th {
      text-align: left;
      padding: .65rem 1rem;
      font-size: .75rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: .05em;
      border-bottom: 1.5px solid #e2e8f0;
    }
    td { padding: .7rem 1rem; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }

    .actions-cell { display: flex; gap: .4rem; }

    /* Empty / loading states */
    .state-row td {
      text-align: center;
      padding: 2.5rem;
      color: #94a3b8;
      font-size: .95rem;
    }

    .badge {
      display: inline-block;
      padding: .2rem .55rem;
      border-radius: 999px;
      font-size: .75rem;
      font-weight: 600;
      background: #e0e7ff;
      color: #4f46e5;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Gestión de Personas</h1>

  <!-- Form Card -->
  <div class="card">
    <h2 id="form-title">Nueva Persona</h2>
    <form id="person-form" novalidate>
      <input type="hidden" id="edit-id" />
      <div class="form-grid">
        <div class="field">
          <label for="nombre">Nombre</label>
          <input id="nombre" placeholder="ej. Ana" />
          <span class="field-error" id="err-nombre"></span>
        </div>
        <div class="field">
          <label for="apellido">Apellido</label>
          <input id="apellido" placeholder="ej. López" />
          <span class="field-error" id="err-apellido"></span>
        </div>
        <div class="field">
          <label for="edad">Edad</label>
          <input id="edad" type="number" min="0" placeholder="ej. 30" />
          <span class="field-error" id="err-edad"></span>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="ej. ana@ejemplo.com" />
          <span class="field-error" id="err-email"></span>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="submit-btn">Guardar</button>
        <button type="button" class="btn btn-secondary" id="cancel-btn" style="display:none">Cancelar</button>
      </div>
    </form>
  </div>

  <!-- Table Card -->
  <div class="card">
    <h2>Listado de Personas</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Edad</th>
            <th>Email</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr class="state-row"><td colspan="6">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  const API = '/api/personas';

  const form       = document.getElementById('person-form');
  const editIdInput= document.getElementById('edit-id');
  const nombreInput= document.getElementById('nombre');
  const apellidoInput= document.getElementById('apellido');
  const edadInput  = document.getElementById('edad');
  const emailInput = document.getElementById('email');
  const submitBtn  = document.getElementById('submit-btn');
  const cancelBtn  = document.getElementById('cancel-btn');
  const formTitle  = document.getElementById('form-title');
  const tableBody  = document.getElementById('table-body');
  const toast      = document.getElementById('toast');

  let toastTimer;

  function showToast(msg, type = 'success') {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.className = `show ${type}`;
    toastTimer = setTimeout(() => { toast.className = ''; }, 3000);
  }

  function setFieldError(fieldId, msg) {
    const input = document.getElementById(fieldId);
    const err   = document.getElementById('err-' + fieldId);
    if (msg) {
      input.classList.add('error');
      err.textContent = msg;
      err.classList.add('visible');
    } else {
      input.classList.remove('error');
      err.textContent = '';
      err.classList.remove('visible');
    }
  }

  function clearErrors() {
    ['nombre','apellido','edad','email'].forEach(f => setFieldError(f, ''));
  }

  function resetForm() {
    form.reset();
    editIdInput.value = '';
    clearErrors();
    formTitle.textContent = 'Nueva Persona';
    submitBtn.textContent = 'Guardar';
    cancelBtn.style.display = 'none';
  }

  async function loadPersonas() {
    tableBody.innerHTML = '<tr class="state-row"><td colspan="6">Cargando...</td></tr>';
    try {
      const res  = await fetch(API);
      const data = await res.json();
      renderTable(data);
    } catch {
      tableBody.innerHTML = '<tr class="state-row"><td colspan="6">Error al cargar los datos.</td></tr>';
    }
  }

  function renderTable(personas) {
    if (!personas.length) {
      tableBody.innerHTML = '<tr class="state-row"><td colspan="6">No hay personas registradas.</td></tr>';
      return;
    }
    tableBody.innerHTML = personas.map(p => `
      <tr>
        <td><span class="badge">${p.id}</span></td>
        <td>${esc(p.nombre)}</td>
        <td>${esc(p.apellido)}</td>
        <td>${p.edad}</td>
        <td>${esc(p.email)}</td>
        <td>
          <div class="actions-cell">
            <button class="btn btn-edit" onclick="startEdit(${p.id})">Editar</button>
            <button class="btn btn-del"  onclick="deletePerson(${p.id})">Eliminar</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  function esc(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErrors();

    const id     = editIdInput.value;
    const nombre = nombreInput.value.trim();
    const apellido = apellidoInput.value.trim();
    const edad   = edadInput.value;
    const email  = emailInput.value.trim();

    const body = { nombre, apellido, edad: edad !== '' ? Number(edad) : null, email };
    const url    = id ? `${API}/${id}` : API;
    const method = id ? 'PUT' : 'POST';

    submitBtn.disabled = true;
    try {
      const res  = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      if (res.ok) {
        showToast(id ? 'Persona actualizada.' : 'Persona creada.', 'success');
        resetForm();
        loadPersonas();
      } else {
        const err = await res.json();
        if (err.errores) {
          Object.entries(err.errores).forEach(([field, msg]) => setFieldError(field, msg));
        } else {
          showToast(err.message || 'Error al guardar.', 'error');
        }
      }
    } catch {
      showToast('Error de conexión.', 'error');
    } finally {
      submitBtn.disabled = false;
    }
  });

  async function startEdit(id) {
    try {
      const res    = await fetch(`${API}/${id}`);
      const person = await res.json();
      editIdInput.value  = person.id;
      nombreInput.value  = person.nombre;
      apellidoInput.value= person.apellido;
      edadInput.value    = person.edad;
      emailInput.value   = person.email;
      formTitle.textContent = 'Editar Persona';
      submitBtn.textContent = 'Actualizar';
      cancelBtn.style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      clearErrors();
    } catch {
      showToast('No se pudo cargar la persona.', 'error');
    }
  }

  async function deletePerson(id) {
    if (!confirm('¿Seguro que deseas eliminar esta persona?')) return;
    try {
      const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
      if (res.ok) {
        showToast('Persona eliminada.', 'success');
        loadPersonas();
      } else {
        showToast('No se pudo eliminar.', 'error');
      }
    } catch {
      showToast('Error de conexión.', 'error');
    }
  }

  cancelBtn.addEventListener('click', resetForm);

  loadPersonas();
</script>
</body>
</html>
